<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a0614">
<title>Your wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
<script>if(/[?&]c=|#d=/.test(location.search+location.hash))document.write("<style>#creator{display:none}</style>")</script>
</head>
<body>
<main id="creator">
  <header class="top">
    <div class="langs"><button class="lb" data-l="bn">বাংলা</button><span>|</span><button class="lb" data-l="en">English</button></div>
    <div class="gift-ico">🎁</div>
    <h1>Your wishes</h1>
    <p class="tag" data-t="Make their birthday unforgettable.|প্রিয়জনের জন্মদিন করে তুলুন স্মরণীয়"></p>
  </header>

  <section class="panel"><h2><i>1</i><span data-t="The basics|মূল তথ্য"></span></h2>
    <label data-t="Your name (sender)|আপনার নাম (প্রেরক)"></label><input id="sender" maxlength="40">
    <label data-t="Recipient name|যার জন্মদিন তার নাম"></label><input id="recipient" maxlength="40">
    <label data-t="Birthday title|জন্মদিনের শিরোনাম"></label><input id="title" maxlength="60" data-ph="Happy Birthday!|শুভ জন্মদিন!">
    <label data-t="Birthday date (optional)|জন্মদিনের তারিখ (ঐচ্ছিক)"></label><input id="date" type="date">
    <label data-t="Personal introduction|ব্যক্তিগত ভূমিকা"></label><textarea id="intro" rows="2" maxlength="200" data-ph="A little surprise is waiting for you…|তোমার জন্য ছোট্ট একটি সারপ্রাইজ অপেক্ষা করছে…"></textarea>
  </section>

  <section class="panel"><h2><i>2</i><span data-t="Four balloon wishes|চারটি বেলুনের শুভেচ্ছা"></span></h2>
    <input class="wish" maxlength="140" data-ph="Wish 1|শুভেচ্ছা ১"><input class="wish" maxlength="140" data-ph="Wish 2|শুভেচ্ছা ২">
    <input class="wish" maxlength="140" data-ph="Wish 3|শুভেচ্ছা ৩"><input class="wish" maxlength="140" data-ph="Wish 4|শুভেচ্ছা ৪">
  </section>

  <section class="panel"><h2><i>3</i><span data-t="Personal letter|ব্যক্তিগত চিঠি"></span></h2>
    <label data-t="Letter title|চিঠির শিরোনাম"></label><input id="ltitle" maxlength="60">
    <label data-t="Your letter|আপনার চিঠি"></label><textarea id="letter" rows="6" maxlength="1500"></textarea>
    <label data-t="Sign-off|চিঠির সমাপ্তি"></label><input id="signoff" maxlength="60" data-ph="With love,|ভালোবাসাসহ,">
  </section>

  <section class="panel"><h2><i>4</i><span data-t="Final birthday message|শেষ জন্মদিনের বার্তা"></span></h2>
    <textarea id="final" rows="3" maxlength="400"></textarea>
  </section>

  <section class="panel"><h2><i>5</i><span data-t="Sweet Moments (up to 6 photos)|মধুর মুহূর্ত (সর্বোচ্চ ৬টি ছবি)"></span></h2>
    <div id="photos" class="pgrid"></div>
  </section>

  <section class="panel"><h2><i>6</i><span data-t="Voice message|ভয়েস বার্তা"></span></h2>
    <div class="row">
      <button class="btn sm" id="rec" data-t="● Record|● রেকর্ড"></button>
      <button class="btn sm" id="stop" hidden data-t="■ Stop|■ থামান"></button>
      <label class="btn sm" for="vfile" data-t="Upload audio|অডিও আপলোড"></label><input id="vfile" type="file" accept="audio/*" hidden>
      <button class="btn sm ghost" id="vdel" hidden data-t="Remove|মুছুন"></button>
    </div>
    <audio id="vprev" controls hidden></audio><p class="hint" id="vmsg"></p>
  </section>

  <section class="panel"><h2><i>7</i><span data-t="Background music|ব্যাকগ্রাউন্ড মিউজিক"></span></h2>
    <label class="btn sm" for="mfile" data-t="Upload music (max 2 MB)|মিউজিক আপলোড (সর্বোচ্চ ২ MB)"></label><input id="mfile" type="file" accept="audio/*" hidden>
    <button class="btn sm ghost" id="mdel" hidden data-t="Remove|মুছুন"></button>
    <label data-t="…or music URL (direct .mp3 link)|…অথবা মিউজিক URL (সরাসরি .mp3 লিংক)"></label><input id="murl" type="url" placeholder="https://">
    <p class="hint" id="mmsg"></p>
  </section>

  <section class="panel"><h2><i>8</i><span data-t="Secret PIN|গোপন পিন"></span></h2>
    <div class="pinrow"><input id="pin" type="password" minlength="4" maxlength="30" autocomplete="off"><button class="btn sm ghost" id="showpin" data-t="Show|দেখান"></button></div>
    <p class="hint" data-t="At least 4 characters, 6+ recommended. Share the PIN separately from the link. This is a light lock, not strong security (see README).|কমপক্ষে ৪ অক্ষর, ৬+ ভালো। পিন লিংক থেকে আলাদাভাবে পাঠান। এটি হালকা লক, শক্তিশালী নিরাপত্তা নয় (README দেখুন)।"></p>
  </section>

  <div class="acts">
    <button class="btn" id="preview" data-t="Preview card|কার্ড প্রিভিউ"></button>
    <button class="btn big" id="create" data-t="CREATE MY CARD|কার্ড তৈরি করুন"></button>
    <button class="btn big alt" id="download" data-t="DOWNLOAD INFORMATION|তথ্য ডাউনলোড"></button>
  </div>
  <p class="err" id="err" role="alert"></p>

  <section class="panel" id="result" hidden><h2><span data-t="Your card is ready|আপনার কার্ড তৈরি হয়েছে"></span></h2>
    <input id="link" readonly>
    <div class="row"><button class="btn sm" id="copy" data-t="Copy link|লিংক কপি"></button><button class="btn sm" id="open" data-t="Open card|কার্ড খুলুন"></button></div>
    <p class="hint" id="rmsg"></p>
  </section>

  <footer class="dev">
    <p class="made">MADE WITH ♡ BY</p>
    <label class="avatar" title="Change photo"><img id="devimg" alt="Misbah"><input id="devfile" type="file" accept="image/*" hidden></label>
    <h3 id="devname">Misbah</h3><p id="devrole"></p>
    <a id="devfb" class="btn sm" target="_blank" rel="noopener">Facebook</a>
  </footer>
</main>

<div id="viewer" hidden></div>
<button id="fab" class="fab" hidden aria-label="Music">♪</button>
<audio id="bgm" loop preload="none"></audio>
<script src="js/config.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
